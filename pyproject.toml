[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ky-ppt-generator"
version = "0.9.6"
description = "Local editable PowerPoint generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=1.0,<2",
  "PySide6>=6.8,<7",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "openai>=2,<3",
  "pywin32>=306; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["ppt_generator*"]
